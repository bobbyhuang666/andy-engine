[package]
name = "andy-core"
version = "0.1.0"
edition = "2021"
description = "Andy Engine Rust core - high-performance emotion and needs computation"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
