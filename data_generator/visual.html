<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Andy Engine — Social Simulation Visualizer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0e17; color: #e0e6f0; font-family: -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }

  #app { display: flex; height: 100vh; }
  #canvas-wrap { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ─── 控制栏 ─── */
  #controls {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    background: rgba(15,20,35,0.92); border: 1px solid rgba(100,140,255,0.25);
    border-radius: 12px; padding: 10px 20px; backdrop-filter: blur(8px);
    z-index: 10;
  }
  #controls button {
    background: rgba(60,100,255,0.2); border: 1px solid rgba(100,140,255,0.4);
    color: #8ab4ff; border-radius: 6px; padding: 6px 14px; cursor: pointer;
    font-size: 13px; transition: all 0.15s;
  }
  #controls button:hover { background: rgba(60,100,255,0.4); color: #fff; }
  #controls button.active { background: rgba(60,100,255,0.5); color: #fff; }
  #time-display {
    font-size: 14px; font-variant-numeric: tabular-nums; min-width: 200px;
    color: #8ab4ff; text-align: center;
  }
  #speed-display { font-size: 12px; color: #667; min-width: 40px; text-align: center; }
  input[type=range] {
    width: 180px; accent-color: #4466cc;
    -webkit-appearance: none; height: 4px; background: #223;
    border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: #5580ff; border-radius: 50%; cursor: pointer;
  }

  /* ─── 信息面板 ─── */
  #info-panel {
    width: 300px; background: rgba(12,16,28,0.96); border-left: 1px solid rgba(100,140,255,0.15);
    padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
    transition: width 0.2s;
  }
  #info-panel.collapsed { width: 0; padding: 0; overflow: hidden; }
  .panel-section h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
    color: #556; margin-bottom: 8px;
  }
  .stat-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .stat-row .label { color: #667; }
  .stat-row .value { color: #aac; font-variant-numeric: tabular-nums; }

  /* 情绪条 */
  .emotion-bar-wrap { margin: 2px 0; }
  .emotion-bar-label { font-size: 11px; color: #667; display: flex; justify-content: space-between; }
  .emotion-bar-track { height: 4px; background: #1a1e2e; border-radius: 2px; overflow: hidden; }
  .emotion-bar-fill { height: 100%; border-radius: 2px; transition: width 0.2s; }

  /* 图例 */
  #legend {
    position: absolute; top: 16px; left: 16px;
    background: rgba(15,20,35,0.88); border: 1px solid rgba(100,140,255,0.15);
    border-radius: 10px; padding: 12px 16px; font-size: 12px; z-index: 10;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-line { width: 24px; height: 0; flex-shrink: 0; }

  /* 天气标签 */
  #weather-tag {
    position: absolute; top: 16px; right: 320px;
    background: rgba(15,20,35,0.88); border: 1px solid rgba(100,140,255,0.15);
    border-radius: 10px; padding: 8px 16px; font-size: 13px; z-index: 10;
  }

  /* 加载遮罩 */
  #loading {
    position: fixed; inset: 0; background: #0a0e17; display: flex;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 16px; z-index: 100; transition: opacity 0.5s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid #223;
    border-top-color: #5580ff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div style="color:#667;font-size:14px" id="load-status">加载数据中...</div>
</div>

<div id="app">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>

    <div id="legend">
      <div style="font-weight:600;margin-bottom:6px;color:#8ab4ff">图例</div>
      <div class="legend-row"><div class="legend-dot" style="background:#ff4444"></div> 负效价（负面情绪）</div>
      <div class="legend-row"><div class="legend-dot" style="background:#44ff88"></div> 正效价（正面情绪）</div>
      <div class="legend-row"><div class="legend-dot" style="background:#666"></div> 中性</div>
      <div style="margin-top:6px;font-size:11px;color:#556">节点大小 = 社交连接数</div>
      <div style="margin-top:8px;border-top:1px solid #223;padding-top:6px">
        <div class="legend-row"><div class="legend-line" style="border-top:2px solid #ff6644"></div> 亲密朋友</div>
        <div class="legend-row"><div class="legend-line" style="border-top:2px solid #4488cc66"></div> 朋友</div>
        <div class="legend-row"><div class="legend-line" style="border-top:1px dashed #33445566"></div> 认识</div>
      </div>
    </div>

    <div id="weather-tag">☀️ 晴天</div>
    <div id="debug-overlay" style="position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(255,0,0,0.8);color:#fff;padding:6px 16px;border-radius:6px;font-size:13px;z-index:20;display:none"></div>

    <div id="controls">
      <button id="btn-play" class="active">⏸ 暂停</button>
      <button id="btn-prev">⏮</button>
      <button id="btn-next">⏭</button>
      <input type="range" id="slider" min="0" max="1" value="0" step="1">
      <div id="time-display">Day 1 · 08:00</div>
      <button id="btn-slower">−</button>
      <div id="speed-display">1×</div>
      <button id="btn-faster">+</button>
      <button id="btn-panel">📊</button>
    </div>
  </div>

  <div id="info-panel">
    <div class="panel-section" id="sec-overview">
      <h3>概览</h3>
      <div id="overview-content"></div>
    </div>
    <div class="panel-section" id="sec-agent" style="display:none">
      <h3>选中 Agent</h3>
      <div id="agent-content"></div>
    </div>
    <div class="panel-section" id="sec-emotions">
      <h3>群体情绪分布</h3>
      <div id="emotions-content"></div>
    </div>
    <div class="panel-section" id="sec-groups">
      <h3>组别效价</h3>
      <div id="groups-content"></div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// 全局状态
// ═══════════════════════════════════════════
let DATA = null;
let snapIdx = 0;
let playing = true;
let speed = 1;         // 1 = 每 100ms 一帧
let selectedAgent = -1;
let hoveredAgent = -1;
const SPEEDS = [0.25, 0.5, 1, 2, 4, 8];

// ═══════════════════════════════════════════
// Canvas
// ═══════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  dpr = window.devicePixelRatio || 1;
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════
// 颜色映射
// ═══════════════════════════════════════════

function valenceColor(v, alpha = 1) {
  // 更敏感的色阶：用数据实际范围 (std≈0.06) 来映射
  const t = Math.max(-1, Math.min(1, v / 0.06));
  if (t >= 0) {
    const hue = 140 - t * 20;  // 140(绿) → 120(纯绿)
    const sat = 50 + t * 40;
    const lgt = 25 + t * 35;
    return `hsla(${hue}, ${sat}%, ${lgt}%, ${alpha})`;
  } else {
    const at = -t;
    const hue = 0 + (1 - at) * 20;  // 20(橙) → 0(红)
    const sat = 50 + at * 40;
    const lgt = 25 + at * 35;
    return `hsla(${hue}, ${sat}%, ${lgt}%, ${alpha})`;
  }
}

const GROUP_COLORS = {
  '学生': '#4488cc',
  '教职工': '#cc8844',
  '周边居民': '#88cc44',
  '高神经质': '#cc4466',
  '低神经质': '#44ccaa',
  '高外向': '#aa44cc',
  '低外向': '#44aacc',
};

const WEATHER_ICONS = { sunny: '☀️', cloudy: '☁️', rain: '🌧️', cold: '❄️' };

// ═══════════════════════════════════════════
// 绘制
// ═══════════════════════════════════════════

let globalTime = 0;

function draw(ts) {
  if (!DATA) return;
  const snap = DATA.snapshots[snapIdx];
  if (!snap) return;
  globalTime = ts || 0;

  ctx.clearRect(0, 0, W, H);

  // 背景渐变
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
  bg.addColorStop(0, '#0f1525');
  bg.addColorStop(1, '#060a12');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const agents = DATA.agents;
  const n = agents.length;
  const prevSnap = snapIdx > 0 ? DATA.snapshots[snapIdx - 1] : snap;

  // ─── 绘制边（使用当前帧的动态强度）───
  const edgeStrengths = snap.edges || DATA.edges.map(e => e[3]);
  const prevEdgeStrengths = prevSnap.edges || edgeStrengths;
  for (let ei = 0; ei < DATA.edges.length; ei++) {
    const [si, ti, baseLevel] = DATA.edges[ei];
    const strength = edgeStrengths[ei];
    const prevStr = prevEdgeStrengths[ei];
    const delta = strength - prevStr;

    // 动态层级：强度决定关系类型
    const level = strength > 0.5 ? 0 : strength > 0.2 ? 1 : 2;
    if (level > 1 && strength < 0.1) continue;  // 太弱的边不画

    const sa = agents[si], ta = agents[ti];
    const ax = sa.x * W, ay = sa.y * H;
    const bx = ta.x * W, by = ta.y * H;

    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);

    // 强度变化时边会闪烁
    const flash = Math.abs(delta) > 0.01 ? 0.15 : 0;

    if (level === 0) {
      // closeFriend: 橙红色，粗
      ctx.strokeStyle = `rgba(255,120,80,${0.06 + strength * 0.25 + flash})`;
      ctx.lineWidth = 0.5 + strength * 2;
    } else if (level === 1) {
      // friend: 蓝色，中等
      ctx.strokeStyle = `rgba(80,150,255,${0.03 + strength * 0.12 + flash})`;
      ctx.lineWidth = 0.3 + strength * 0.8;
    } else {
      // acquaintance: 暗灰虚线
      ctx.strokeStyle = `rgba(60,80,100,${0.02 + strength * 0.06})`;
      ctx.lineWidth = 0.3;
      ctx.setLineDash([3, 5]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // ─── 绘制节点 ───
  for (let i = 0; i < n; i++) {
    const a = agents[i];
    const s = snap.agents[i];
    const ps = prevSnap.agents[i];
    const x = a.x * W;
    const y = a.y * H;
    const baseR = 4 + Math.min(a.degree / 4, 6);
    const vDelta = s.v - ps.v;

    // 脉冲效果：效价变化大的 agent 半径呼吸
    const pulse = 1 + Math.sin(globalTime * 0.005 + i) * 0.08 + Math.abs(vDelta) * 15;
    const r = baseR * pulse;

    // 外发光
    const glowR = r * (2.5 + Math.abs(s.v) * 5);
    const glow = ctx.createRadialGradient(x, y, r * 0.5, x, y, glowR);
    glow.addColorStop(0, valenceColor(s.v, 0.25 + Math.abs(s.v) * 0.5));
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, glowR, 0, Math.PI * 2);
    ctx.fill();

    // 主体
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = valenceColor(s.v, 0.9);
    ctx.fill();

    // 内核高光
    const hl = ctx.createRadialGradient(x - r*0.3, y - r*0.3, 0, x, y, r);
    hl.addColorStop(0, 'rgba(255,255,255,0.15)');
    hl.addColorStop(1, 'transparent');
    ctx.fillStyle = hl;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // 选中高亮
    if (i === selectedAgent) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(x, y, r + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (i === hoveredAgent && i !== selectedAgent) {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x, y, r + 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // ─── 大字时间戳 ───
  ctx.save();
  ctx.font = 'bold 16px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(120,160,255,0.6)';
  ctx.textAlign = 'left';
  ctx.fillText(`Day ${snap.day + 1}  ${snap.time}`, 16, H - 16);

  // 帧计数器（调试用，2秒后消失）
  if (frameCount < 100) {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '11px monospace';
    ctx.fillText(`frame ${frameCount} | snap ${snapIdx} | W=${W} H=${H}`, 16, 20);
  }
  ctx.restore();

  // ─── 底部时间轴进度条 ───
  const barY = H - 4;
  const barW = W;
  ctx.fillStyle = 'rgba(30,40,60,0.5)';
  ctx.fillRect(0, barY, barW, 4);
  const progress = snapIdx / Math.max(1, DATA.snapshots.length - 1);
  ctx.fillStyle = 'rgba(80,130,255,0.6)';
  ctx.fillRect(0, barY, barW * progress, 4);
}

// ═══════════════════════════════════════════
// 动画循环
// ═══════════════════════════════════════════

let lastTick = 0;
const FRAME_INTERVAL = 80; // ms per frame at 1×
let frameCount = 0;

function animate(ts) {
  requestAnimationFrame(animate);
  if (!DATA) return;
  frameCount++;
  if (frameCount === 3) console.log(`[Andy Visual] 动画运行中, W=${W}, H=${H}, playing=${playing}`);

  if (playing && ts - lastTick > FRAME_INTERVAL / speed) {
    lastTick = ts;
    snapIdx = (snapIdx + 1) % DATA.snapshots.length;
    updateUI();
  }
  draw(ts);
}

// ═══════════════════════════════════════════
// UI 更新
// ═══════════════════════════════════════════

function updateUI() {
  const snap = DATA.snapshots[snapIdx];
  if (!snap) return;

  // 时间
  document.getElementById('time-display').textContent =
    `Day ${snap.day + 1} · ${snap.time}`;

  // 天气
  document.getElementById('weather-tag').textContent =
    `${WEATHER_ICONS[snap.weather] || '🌤️'} ${snap.weather}`;

  // 滑块
  document.getElementById('slider').value = snapIdx;

  // 面板
  updatePanel(snap);
}

function updatePanel(snap) {
  const n = snap.agents.length;

  // 概览
  let vSum = 0, vMin = 1, vMax = -1;
  for (const a of snap.agents) {
    vSum += a.v;
    vMin = Math.min(vMin, a.v);
    vMax = Math.max(vMax, a.v);
  }
  const vMean = vSum / n;
  document.getElementById('overview-content').innerHTML = `
    <div class="stat-row"><span class="label">快照</span><span class="value">${snapIdx + 1} / ${DATA.snapshots.length}</span></div>
    <div class="stat-row"><span class="label">Agents</span><span class="value">${n}</span></div>
    <div class="stat-row"><span class="label">平均效价</span><span class="value">${vMean.toFixed(4)}</span></div>
    <div class="stat-row"><span class="label">效价范围</span><span class="value">[${vMin.toFixed(3)}, ${vMax.toFixed(3)}]</span></div>
  `;

  // 选中 agent
  if (selectedAgent >= 0 && selectedAgent < n) {
    const a = DATA.agents[selectedAgent];
    const s = snap.agents[selectedAgent];
    const emoBars = Object.entries(s.e).map(([name, val]) => {
      const pct = Math.min(100, Math.abs(val) * 500);
      const color = val >= 0 ? '#44ff88' : '#ff4444';
      return `<div class="emotion-bar-wrap">
        <div class="emotion-bar-label"><span>${name}</span><span>${val.toFixed(3)}</span></div>
        <div class="emotion-bar-track"><div class="emotion-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      </div>`;
    }).join('');

    document.getElementById('sec-agent').style.display = '';
    document.getElementById('agent-content').innerHTML = `
      <div class="stat-row"><span class="label">ID</span><span class="value">${a.id}</span></div>
      <div class="stat-row"><span class="label">组</span><span class="value" style="color:${GROUP_COLORS[a.group] || '#aaa'}">${a.group}</span></div>
      <div class="stat-row"><span class="label">MBTI</span><span class="value">${a.mbti}</span></div>
      <div class="stat-row"><span class="label">效价</span><span class="value" style="color:${valenceColor(s.v)}">${s.v.toFixed(4)}</span></div>
      <div class="stat-row"><span class="label">连接数</span><span class="value">${a.degree}</span></div>
      <div style="margin-top:8px">${emoBars}</div>
    `;
  } else {
    document.getElementById('sec-agent').style.display = 'none';
  }

  // 群体情绪均值
  const emoAvg = {};
  for (const a of snap.agents) {
    for (const [k, v] of Object.entries(a.e)) {
      emoAvg[k] = (emoAvg[k] || 0) + v / n;
    }
  }
  const emoHtml = Object.entries(emoAvg).map(([name, avg]) => {
    const pct = Math.min(100, Math.abs(avg) * 500);
    const color = avg >= 0 ? '#44ff88' : '#ff4444';
    return `<div class="emotion-bar-wrap">
      <div class="emotion-bar-label"><span>${name}</span><span>${avg.toFixed(4)}</span></div>
      <div class="emotion-bar-track"><div class="emotion-bar-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }).join('');
  document.getElementById('emotions-content').innerHTML = emoHtml;

  // 组别效价
  const groups = {};
  snap.agents.forEach((s, i) => {
    const g = DATA.agents[i].group;
    if (!groups[g]) groups[g] = { sum: 0, count: 0 };
    groups[g].sum += s.v;
    groups[g].count++;
  });
  const groupHtml = Object.entries(groups).map(([name, g]) => {
    const avg = g.sum / g.count;
    return `<div class="stat-row">
      <span class="label" style="color:${GROUP_COLORS[name] || '#aaa'}">${name} (${g.count})</span>
      <span class="value" style="color:${valenceColor(avg)}">${avg.toFixed(4)}</span>
    </div>`;
  }).join('');
  document.getElementById('groups-content').innerHTML = groupHtml;
}

// ═══════════════════════════════════════════
// 交互
// ═══════════════════════════════════════════

// 点击选中 agent
canvas.addEventListener('click', e => {
  if (!DATA) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let best = -1, bestDist = 20;
  for (let i = 0; i < DATA.agents.length; i++) {
    const a = DATA.agents[i];
    const dx = a.x * W - mx, dy = a.y * H - my;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < bestDist) { bestDist = dist; best = i; }
  }
  selectedAgent = best;
  updateUI();
});

// Hover
canvas.addEventListener('mousemove', e => {
  if (!DATA) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let best = -1, bestDist = 15;
  for (let i = 0; i < DATA.agents.length; i++) {
    const a = DATA.agents[i];
    const dx = a.x * W - mx, dy = a.y * H - my;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < bestDist) { bestDist = dist; best = i; }
  }
  hoveredAgent = best;
  canvas.style.cursor = best >= 0 ? 'pointer' : 'default';

  // Tooltip
  if (best >= 0) {
    const a = DATA.agents[best];
    const s = DATA.snapshots[snapIdx].agents[best];
    canvas.title = `${a.id} (${a.mbti})\n效价: ${s.v.toFixed(4)}\n连接: ${a.degree}`;
  } else {
    canvas.title = '';
  }
});

// 播放/暂停
document.getElementById('btn-play').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('btn-play').textContent = playing ? '⏸ 暂停' : '▶ 播放';
  document.getElementById('btn-play').classList.toggle('active', playing);
});

// 上一帧/下一帧
document.getElementById('btn-prev').addEventListener('click', () => {
  snapIdx = Math.max(0, snapIdx - 1);
  updateUI();
});
document.getElementById('btn-next').addEventListener('click', () => {
  snapIdx = Math.min(DATA.snapshots.length - 1, snapIdx + 1);
  updateUI();
});

// 速度
document.getElementById('btn-slower').addEventListener('click', () => {
  const i = SPEEDS.indexOf(speed);
  if (i > 0) { speed = SPEEDS[i - 1]; document.getElementById('speed-display').textContent = speed + '×'; }
});
document.getElementById('btn-faster').addEventListener('click', () => {
  const i = SPEEDS.indexOf(speed);
  if (i < SPEEDS.length - 1) { speed = SPEEDS[i + 1]; document.getElementById('speed-display').textContent = speed + '×'; }
});

// 滑块
document.getElementById('slider').addEventListener('input', e => {
  snapIdx = parseInt(e.target.value);
  updateUI();
});

// 面板折叠
document.getElementById('btn-panel').addEventListener('click', () => {
  document.getElementById('info-panel').classList.toggle('collapsed');
  setTimeout(resize, 250);
});

// 键盘快捷键
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); document.getElementById('btn-play').click(); }
  if (e.key === 'ArrowLeft') { snapIdx = Math.max(0, snapIdx - 1); updateUI(); }
  if (e.key === 'ArrowRight') { snapIdx = Math.min(DATA.snapshots.length - 1, snapIdx + 1); updateUI(); }
  if (e.key === 'Escape') { selectedAgent = -1; updateUI(); }
});

// ═══════════════════════════════════════════
// 加载数据
// ═══════════════════════════════════════════

function showDebug(msg, color = 'rgba(255,0,0,0.8)') {
  const el = document.getElementById('debug-overlay');
  el.style.display = 'block';
  el.style.background = color;
  el.textContent = msg;
  console.log('[Andy Visual]', msg);
}

async function init() {
  resize();
  showDebug('加载数据中...', 'rgba(100,100,200,0.8)');

  // 尝试加载同目录下的 visual_data.json
  let url = 'visual_data.json';
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(resp.statusText);
    DATA = await resp.json();
  } catch (e) {
    // 尝试上一级目录
    try {
      const resp2 = await fetch('../visual_data.json');
      if (!resp2.ok) throw new Error(resp2.statusText);
      DATA = await resp2.json();
    } catch (e2) {
      showDebug(`加载失败: ${e.message}`, 'rgba(255,0,0,0.9)');
      document.getElementById('load-status').textContent =
        '无法加载 visual_data.json — 请将此 HTML 与数据文件放在同一目录，或通过 HTTP 服务器打开';
      return;
    }
  }

  document.getElementById('load-status').textContent = `加载完成: ${DATA.agents.length} agents, ${DATA.snapshots.length} snapshots`;

  // 显示成功信息然后淡出
  showDebug(`✓ ${DATA.agents.length} agents, ${DATA.snapshots.length} 帧`, 'rgba(40,180,80,0.8)');
  setTimeout(() => {
    document.getElementById('debug-overlay').style.display = 'none';
  }, 2000);

  // 设置滑块范围
  document.getElementById('slider').max = DATA.snapshots.length - 1;

  // 隐藏加载遮罩
  setTimeout(() => document.getElementById('loading').classList.add('hidden'), 300);

  // 开始动画
  updateUI();
  console.log(`[Andy Visual] 数据加载完成: ${DATA.agents.length} agents, ${DATA.snapshots.length} snaps`);
  console.log(`[Andy Visual] Canvas: ${W}x${H}`);
  console.log(`[Andy Visual] 首帧效价:`, DATA.snapshots[0].agents.slice(0, 5).map(a => a.v));
  requestAnimationFrame(animate);
}

init();
</script>
</body>
</html>
